<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Validasi Voltage | Teknik Elektro ITS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        /* Header & Navbar */
        header {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        header h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; gap: 8px; }
        header p { font-size: 0.875rem; color: var(--text-muted); margin-top: 4px; }

        /* Tab Navigation (Scrollable di HP) */
        .tabs-container {
            max-width: 1200px; margin: 20px auto; padding: 0 15px;
            overflow-x: auto; white-space: nowrap;
            /* Sembunyikan scrollbar tapi tetap bisa di-scroll */
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs { display: flex; gap: 10px; justify-content: flex-start; }
        
        @media (min-width: 768px) { .tabs { justify-content: center; } } /* Tengah di layar lebar */

        .tab-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 10px 20px; border-radius: 50px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }

        /* Main Content */
        main { max-width: 1200px; margin: 0 auto; padding: 0 15px 40px; }
        
        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
            overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1); }
        
        .card-img-wrapper { width: 100%; height: 200px; background: #f1f5f9; position: relative; cursor: zoom-in; }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .no-img { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 0.9rem; flex-direction: column; gap: 8px; }

        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
        .card-title h3 { font-size: 1.1rem; line-height: 1.3; }
        .badge { background: #f1f5f9; color: var(--primary-dark); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
        
        .card-info { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }
        .card-info p { margin-bottom: 4px; }
        
        .btn-wa {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: #25D366; color: white; text-decoration: none;
            padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .btn-wa:hover { opacity: 0.9; }

        /* Loading State */
        .loader-container { text-align: center; padding: 40px; display: none; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Empty State */
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); display: none; grid-column: 1 / -1; }

        /* Lightbox (Zoom Image) */
        .lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 999;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .lightbox img { max-width: 95%; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .close-lightbox { color: white; font-size: 30px; position: absolute; top: 20px; right: 30px; cursor: pointer; }
        .lightbox-caption { color: white; margin-top: 15px; font-size: 1rem; }

    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-bolt"></i> Portal Validasi Voltage</h1>
        <p>Sistem Pengecekan Kehadiran & Izin IONICS</p>
    </header>

    <div class="tabs-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="changeTab('HADIR', this)">Hadir</button>
            <button class="tab-btn" onclick="changeTab('SAKIT', this)">Sakit</button>
            <button class="tab-btn" onclick="changeTab('KEAGAMAAN', this)">Keagamaan</button>
            <button class="tab-btn" onclick="changeTab('BERDUKA', this)">Berduka</button>
            <button class="tab-btn" onclick="changeTab('AKADEMIK', this)">Akademik</button>
        </div>
    </div>

    <main>
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p>Menyinkronkan data dari Google Sheets...</p>
        </div>
        
        <div class="grid" id="dataContainer"></div>
        
        <div class="empty-state" id="emptyState">
            <i class="fa-regular fa-folder-open fa-3x" style="margin-bottom: 15px;"></i>
            <h3>Belum Ada Data</h3>
            <p>Tidak ada data peserta pada kategori ini.</p>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="" alt="Bukti Diperbesar" onclick="event.stopPropagation()">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script>
        // === GANTI URL DI BAWAH INI DENGAN WEB APP URL ANDA ===
        const API_URL = "URL_WEB_APP_ANDA_DI_SINI"; 
        // =======================================================

        let currentTab = 'HADIR';

        // Konversi URL Drive biasa menjadi URL Direct Download (Bisa dirender img src)
        function getDirectImageUrl(url) {
            if (!url) return null;
            const idMatch = url.match(/id=([^&]+)/);
            if (idMatch && idMatch[1]) {
                return `https://drive.google.com/uc?export=view&id=${idMatch[1]}`;
            }
            return null;
        }

        async function loadData(sheetName) {
            const container = document.getElementById("dataContainer");
            const loader = document.getElementById("loader");
            const emptyState = document.getElementById("emptyState");
            
            container.innerHTML = "";
            emptyState.style.display = "none";
            loader.style.display = "block";

            try {
                const response = await fetch(`${API_URL}?sheet=${sheetName}`);
                const data = await response.json();
                loader.style.display = "none";

                let hasValidData = false;

                data.forEach(peserta => {
                    if(!peserta.Nama || !peserta.NRP) return; 
                    hasValidData = true;
                    
                    const imgUrl = getDirectImageUrl(peserta["Bukti Foto"]);
                    const card = document.createElement("div");
                    card.className = "card";
                    
                    // Render Image Area
                    let imgArea = '';
                    if (imgUrl) {
                        imgArea = `
                            <div class="card-img-wrapper" onclick="openLightbox('${imgUrl}', '${peserta.Nama}')">
                                <img src="${imgUrl}" alt="Bukti ${peserta.Nama}" loading="lazy">
                            </div>
                        `;
                    } else {
                        imgArea = `
                            <div class="card-img-wrapper" style="cursor:default;">
                                <div class="no-img">
                                    <i class="fa-solid fa-image-slash fa-2x"></i>
                                    <span>Tidak ada lampiran</span>
                                </div>
                            </div>
                        `;
                    }

                    // Render Phone Button
                    let waLink = peserta['Nomor Telepon'] || '#';
                    let waBtnText = waLink !== '#' ? 'Hubungi Peserta' : 'Nomor Tidak Tersedia';
                    
                    card.innerHTML = `
                        ${imgArea}
                        <div class="card-body">
                            <div class="card-title">
                                <h3>${peserta.Nama}</h3>
                                <span class="badge">${peserta.FGD || '-'}</span>
                            </div>
                            <div class="card-info">
                                <p><strong>NRP:</strong> ${peserta.NRP}</p>
                            </div>
                            <a href="${waLink}" target="_blank" class="btn-wa">
                                <i class="fa-brands fa-whatsapp"></i> ${waBtnText}
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                if (!hasValidData) emptyState.style.display = "block";

            } catch (error) {
                loader.style.display = "none";
                emptyState.innerHTML = `<i class="fa-solid fa-triangle-exclamation fa-3x"></i><h3>Gagal Memuat Data</h3><p>Periksa koneksi internet atau Web App URL Anda.</p>`;
                emptyState.style.display = "block";
                console.error("Error fetching data:", error);
            }
        }

        function changeTab(sheetName, btnElement) {
            if (currentTab === sheetName) return;
            currentTab = sheetName;
            
            // Update UI Tab Aktif
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            loadData(sheetName);
        }

        // Lightbox Functions
        function openLightbox(imgSrc, caption) {
            document.getElementById("lightboxImg").src = imgSrc;
            document.getElementById("lightboxCaption").innerText = "Bukti Milik: " + caption;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }

        // Memuat data 'HADIR' saat halaman pertama kali dibuka
        window.onload = () => loadData('HADIR');
    </script>
</body>
</html>
